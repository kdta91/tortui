name: CI

# T-945: push runs only on main (every task branch has a PR, whose pull_request run is the one
# branch protection reads), so a PR push no longer runs the whole matrix twice. Docs-only pushes to
# main (a Blocked entry, tracker text) skip CI; pull_request runs are never path-filtered, so a
# required check can never be left pending.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: ["**"]

# A newer push to the same PR cancels the superseded run. Main runs are grouped per commit, so
# they are never cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOFUMPT_VERSION: "v0.12.0"
  GITLEAKS_VERSION: "v8.30.1"
  GO_LICENSES_VERSION: "v2.0.1"

jobs:
  check:
    name: make check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # T-945: compiling the pinned tools from source took ~3 of the Windows job's 8 minutes.
      # Cache the built binaries, keyed on OS + Go + every pinned version, and only `go install`
      # them on a miss. Changing a version in `env` above changes the key, so a bump is never
      # served a stale binary.
      - name: Cache pinned tool binaries
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/gofumpt*
            ~/go/bin/golangci-lint*
            ~/go/bin/gitleaks*
          key: tools-${{ runner.os }}-go${{ env.GO_VERSION }}-gofumpt${{ env.GOFUMPT_VERSION }}-golangci${{ env.GOLANGCI_LINT_VERSION }}-gitleaks${{ env.GITLEAKS_VERSION }}

      - name: Install gofumpt
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}

      # Unpinned (@latest), so deliberately not cached: it would otherwise freeze at whatever
      # version the first cache fill saw.
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Install golangci-lint
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install gitleaks
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}

      - name: Add GOPATH/bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make -y --no-progress

      # T-005: installed explicitly on every OS rather than assumed present,
      # the same reasoning DEC-029 already applied to gitleaks — a runner
      # image's preinstalled tool list is not something this workflow relies
      # on without saying so.
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install shellcheck (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install shellcheck -y --no-progress

      - name: make check
        shell: bash
        run: make check

  build-all:
    name: make build-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Cross-compilation output does not depend on the host OS/arch — a
      # single ubuntu-latest job builds and verifies all six tier-1
      # combinations from AGENT.md §14 on every push, per T-005.
      - name: make build-all
        run: make build-all

  licenses:
    name: make licenses (NOTICE up to date, no disallowed license)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@${{ env.GO_LICENSES_VERSION }}

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `make licenses` itself fails if any dependency's license is outside
      # AGENT.md §3/§16's MIT/Apache-2.0/BSD/ISC/MPL-2.0 allowlist (which also
      # catches GPL/AGPL/LGPL and unlicensed dependencies, since none of those
      # are in the allowlist -- MPL-2.0 is a named exception for the torrent
      # engine and the modules it compiles against, T-942/DEC-098 widened to
      # that set by T-943/DEC-100, not a general copyleft admission).
      # That allowlist has no per-module scoping on its own, so `make
      # licenses` also runs scripts/check-license-scope.sh, which fails the
      # build if any MPL-2.0 module outside the Makefile's enumerated
      # ALLOWED_MPL_MODULES shows up -- including one under the same
      # github.com/anacrolix/ path, since that list is names, not a prefix
      # (see AGENT.md §16 for why the allowlist alone can't enforce this).
      # Both checks run before NOTICE is regenerated. Like
      # build-all, this runs once on ubuntu-latest: the Makefile target
      # itself loops GOOS=darwin/linux/windows internally (see the Makefile's
      # T-006 comment), so one host is enough to analyze all three.
      - name: make licenses
        run: make licenses

      # Fails the build if the working tree's NOTICE differs from what
      # `make licenses` just regenerated — i.e. NOTICE was stale relative to
      # go.mod/go.sum or the dependency's own build-tag-gated imports.
      - name: Verify NOTICE is up to date
        run: |
          set -eu
          git diff --exit-code -- NOTICE || {
            echo "NOTICE is stale: run 'make licenses' and commit the result.";
            exit 1;
          }

  indexer-hostnames:
    # This job's name is the exact context registered in branch protection's
    # required_status_checks.contexts on main (DEC-042, QA remediation of
    # PR #7) -- change it here and in that branch protection setting
    # together, or a rename silently strands every future PR waiting on a
    # context that will never report again.
    name: check indexer hostname allowlist (T-007)
    # Only meaningful with a base/head to diff, so this only runs on the
    # pull_request event -- see scripts/check-indexer-hostnames.sh's own
    # header for what it actually checks (including commit messages) and why
    # it can never be a denylist of known piracy hostnames (AGENT.md §2). A
    # push-triggered run of this same workflow always reports this job as
    # skipped for that reason, which required-status-check enforcement
    # treats as passing -- the pull_request-triggered run alongside it is
    # the one that actually evaluates the diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Both the base and head commits must be present locally for the
          # diff the script runs; the default shallow/single-commit checkout
          # for a pull_request event doesn't guarantee that.
          fetch-depth: 0

      - name: Scan the PR diff for new indexer hostnames
        run: |
          set -eu
          scripts/check-indexer-hostnames.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
